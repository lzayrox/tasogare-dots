[config]
reload_apps = true

[templates.quickshell]
input_path = "~/.config/matugen/templates/colors.json"
output_path = "~/.local/state/quickshell/colors.json"

[templates.greetd]
input_path = "~/.config/matugen/templates/Theme.qml"
output_path = "~/.config/quickshell/greetd/Theme.qml"

[templates.hyprland]
input_path = "~/.config/matugen/templates/colors.lua"
output_path = "~/.config/hypr/conf/colors.lua"
post_hook = "hyprctl reload || true"
