# =============================================================================
# Tasogare Hyprlock - Style 1 (Sidebar Left-Aligned Layout)
# =============================================================================
source = ~/.config/hypr/hyprlock/colors.conf

general {
    disable_loading_bar = true
    hide_cursor = true
    grace = 0
    no_fade_in = false
}

background {
    monitor =
    path = ~/.config/hypr/hyprlock/hyprlock.png
    blur_passes = 0
    contrast = 0.8916
    brightness = 0.80
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# -----------------------------------------------------------------------------
# GREETINGS
# -----------------------------------------------------------------------------
label {
    monitor =
    text = Welcome!
    color = $on_surface
    font_size = 55
    font_family = SFMono Nerd Font
    position = 150, 320
    halign = left
    valign = center
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.4)
}

# -----------------------------------------------------------------------------
# TIME
# -----------------------------------------------------------------------------
label {
    monitor =
    text = cmd[update:1000] echo "<span>$(date +"%I:%M")</span>"
    color = $primary
    font_size = 40
    font_family = SF Pro Display
    position = 240, 240
    halign = left
    valign = center
    shadow_passes = 1
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.3)
}

# -----------------------------------------------------------------------------
# DAY - MONTH - DATE
# -----------------------------------------------------------------------------
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%A, %B %d")"
    color = $secondary
    font_size = 19
    font_family = SF Pro Display
    position = 217, 175
    halign = left
    valign = center
    shadow_passes = 1
    shadow_size = 2
    shadow_color = rgba(0, 0, 0, 0.3)
}

# -----------------------------------------------------------------------------
# USER BOX SHAPE
# -----------------------------------------------------------------------------
shape {
    monitor =
    size = 320, 55
    color = $surface
    rounding = -1
    border_size = 0
    border_color = rgba(255, 255, 255, 1)
    rotate = 0
    xray = false

    position = 160, -140
    halign = left
    valign = center
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.35)
}

# -----------------------------------------------------------------------------
# USER LABEL
# -----------------------------------------------------------------------------
label {
    monitor =
    text = cmd[update:0] echo "    $USER@$(hostname)"
    color = $on_surface
    outline_thickness = 0
    font_size = 15
    font_family = SFMono Nerd Font
    position = 185, -140
    halign = left
    valign = center
}

# -----------------------------------------------------------------------------
# INPUT FIELD
# -----------------------------------------------------------------------------
input-field {
    monitor =
    size = 320, 55
    outline_thickness = 0
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(255, 255, 255, 0)
    inner_color = $surface
    font_color = $on_surface
    fade_on_empty = false
    font_family = SF Pro Display
    placeholder_text = <i><span foreground="##ffffff99">Enter Pass...</span></i>
    hide_input = false
    position = 160, -220
    halign = left
    valign = center
}

# -----------------------------------------------------------------------------
# CURRENT SONG
# -----------------------------------------------------------------------------
label {
    monitor =
    text = cmd[update:1000] echo "$(~/.config/hypr/hyprlock/songdetail.sh)"
    color = $tertiary
    font_size = 14
    font_family = SF Pro Display
    position = 210, 45
    halign = left
    valign = bottom
    shadow_passes = 1
    shadow_size = 2
    shadow_color = rgba(0, 0, 0, 0.3)
}
